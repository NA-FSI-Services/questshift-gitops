[project]
name = "questshift-gitops"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
pythonpath = [".", "install/scripts"]
testpaths = ["tests"]
addopts = "--cov=tools --cov=install/scripts --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["tools", "install/scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"install/scripts/wait_operator.py" = ["E402"]
