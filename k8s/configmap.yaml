apiVersion: v1
kind: ConfigMap
metadata:
  name: questshift-engine
  labels:
    app.kubernetes.io/part-of: questshift
data:
  QUESTSHIFT_CAMPAIGNS_DIR: /work/campaigns
  QUARKUS_HTTP_HOST: "0.0.0.0"
  questshift.llm.base-url: http://questshift-llm:8000/v1
  questshift.llm.model: ibm-granite/granite-3.1-8b-instruct
  questshift.llm.enabled: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: questshift-llm
  labels:
    app.kubernetes.io/part-of: questshift
data:
  MODEL_ID: ibm-granite/granite-3.1-8b-instruct
  MAX_MODEL_LEN: "8192"
