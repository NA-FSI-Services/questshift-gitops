apiVersion: apps/v1
kind: Deployment
metadata:
  name: questshift-llm
  labels:
    app: questshift-llm
    app.kubernetes.io/part-of: questshift
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: questshift-llm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: questshift-llm
    spec:
      runtimeClassName: nvidia
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /models
            - --served-model-name
            - ibm-granite/granite-3.2-8b-instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --trust-remote-code
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # OpenShift restricted SCC: random UID cannot write /.cache.
            - name: HOME
              value: /models/.runtime
            - name: HF_HOME
              value: /models/.runtime
            - name: XDG_CACHE_HOME
              value: /models/.runtime/cache
            - name: FLASHINFER_WORKSPACE_DIR
              value: /models/.runtime/flashinfer
            - name: VLLM_CACHE_ROOT
              value: /models/.runtime/vllm
            - name: NUMBA_CACHE_DIR
              value: /models/.runtime/numba
            - name: TMPDIR
              value: /models/.runtime/tmp
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: "2"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: questshift-llm-cache
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
