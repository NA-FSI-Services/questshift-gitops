apiVersion: questshift.io/v1
kind: Campaign
metadata:
  id: devops-dungeon
  title: The Cluster That Forgot Its Name
  subtitle: A 60-minute dungeon crawl through Linux, Ansible, OpenShift, and Java
  durationMinutes: 60
  recommendedPartySize: 4
  license: Apache-2.0
seats:
  - id: guardian
    title: Guardian
    color: "#3d7a4a"
    blurb: Cosmetic. Traditionally a Linux tinkerer. Anyone may still solve any room.
  - id: automancer
    title: Automancer
    color: "#c45c26"
    blurb: Cosmetic. Traditionally an Ansible hand. Anyone may still solve any room.
  - id: ranger
    title: Cluster Ranger
    color: "#2a6f97"
    blurb: Cosmetic. Traditionally an OpenShift ranger. Anyone may still solve any room.
  - id: artificer
    title: Artificer
    color: "#7b4ea3"
    blurb: Cosmetic. Traditionally a Java artificer. Anyone may still solve any room.
story:
  premise: |
    The workshop cluster woke up unnamed. Labels fell off. Pods loop.
    Playbooks bind the wrong hosts. A Java service answers every probe with silence.
    Four travelers find a dungeon that is also a platform. Restore the name, or the hour is lost.
  opening: |
    Torchlight on brushed metal. The Game Master leans on a cracked Route.
    "Sixty minutes. Five rooms. The cluster forgot its name. You will remind it."
  winCondition: |
    Complete all five rooms. The Operator's Throne accepts the restored cluster name
    and the party exports their session YAML as proof of the run.
  failCondition: |
    The hour ends with the boss room unsolved. The cluster remains nameless.
    Export still works so the next party can resume.
rooms:
  - id: room-01-broken-shell
    order: 1
    title: The Broken Shell
    mapX: 120
    mapY: 220
    puzzle_type: linux
    estimatedMinutes: 10
    guardian:
      id: shell-golem
      title: Shell golem
      sprite: guardian_shell
    narrative: |
      A shell golem bars the north challenge door. The south door stands open
      back to the lobby. Chests on the floor hold a filesystem tree, a log leaf,
      and a torn man page. The golem will not yield to a name shouted without
      proof it lives in its filesystem. Pipe wisely.
    prompt: |
      The simulated log is /var/log/quest.log. Extract the rune token
      (the last field on the line that contains 'rune', ignoring case).
      A name by itself is not evidence. A grep without awk is too much line.
    sample_output: |
      12:01:02 INFO dungeon boot
      12:01:03 WARN goblin chatter rune=THORN
      12:01:04 INFO pods dreaming
    expected_command_pattern: "(?s).*grep.*-i.*rune.*awk.*\\$NF.*|.*grep.*-i.*rune.*awk.*'\\{print \\$NF\\}'.*|.*awk.*[Rr]une.*\\$NF.*"
    accepted_examples:
      - cat /var/log/quest.log | grep -i rune | awk '{print $NF}'
      - grep -i rune /var/log/quest.log | awk '{print $NF}'
    forbidden_patterns:
      - "^\\s*cat\\s+/var/log/quest\\.log\\s*$"
    hint: The golem hates cat-only answers. Grep the rune, then awk the last field.
    miss_beats:
      - pattern: "(?i)^\\s*(thorn|rune=thorn|thorn-ash-oak-iron)\\s*$"
        message: >
          The golem rumbles. A name shouted into the dark is not evidence
          it lives in my filesystem. Show the path.
      - pattern: "(?s)^(?!.*awk).*grep.*rune.*"
        message: >
          The golem squints at the whole line. The resolved name is too long.
          Only part of that line is relevant.
    clues:
      - id: shell-tree
        label: carved directory tree
        text: |
          /
          ├── etc
          ├── home
          └── var
              └── log
                  ├── boot.log
                  └── quest.log
        x: 260
        y: 200
      - id: shell-log
        label: weathered log leaf
        text: |
          /var/log/quest.log
          12:01:02 INFO dungeon boot
          12:01:03 WARN goblin chatter rune=THORN
          12:01:04 INFO pods dreaming
        x: 520
        y: 200
      - id: shell-man
        label: torn man page
        text: |
          GREP(1)
            grep -i PATTERN FILE
            Print lines matching PATTERN, ignoring case.

          AWK(1)
            awk '{print $NF}'
            $NF is the last field of the line.
            A matching line can be longer than the token you need.
        x: 680
        y: 260
    success_narrative: |
      The golem cracks. A shard labeled THORN drops into the party's inventory.
      The north door unseals with a hiss of stdout.
    loot:
      - id: rune-thorn
        name: Rune of Thorn
        kind: key
    canvas_event: unlock_room_02
    skills_granted:
      - piping

  - id: room-02-playbook-of-binding
    order: 2
    title: The Playbook of Binding
    mapX: 280
    mapY: 140
    puzzle_type: ansible
    estimatedMinutes: 10
    guardian:
      id: bound-familiar
      title: Bound familiar
      sprite: guardian_playbook
    narrative: |
      A bound familiar bars the north challenge door. The south door stands open
      back to the lobby. An Automancer's grimoire lies open. The play binds the
      wrong hosts. Tasks have no names. The dungeon will not apply a nameless task.
    prompt: |
      Submit a minimal play that targets hosts: dungeon, gathers facts,
      and has one named task that writes /etc/questshift/name using copy or template.
    broken_snippet: |
      - hosts: all
        tasks:
          - copy:
              dest: /tmp/oops
              content: forgotten
    expected_command_pattern: "(?s).*hosts:\\s*dungeon.*gather_facts:\\s*true.*name:\\s*.+\\n\\s+(copy|template):.*dest:\\s*/etc/questshift/name.*"
    accepted_examples:
      - |
        - hosts: dungeon
          gather_facts: true
          tasks:
            - name: Inscribe the cluster name
              copy:
                dest: /etc/questshift/name
                content: "{{ inventory_hostname }}\n"
    hint: hosts must be dungeon, gather_facts must be true, and the task must have a name.
    clues:
      - id: play-hosts
        label: inventory ledger
        text: "hosts: dungeon"
        x: 260
        y: 200
      - id: play-facts
        label: bound scroll
        text: "gather_facts: true"
        x: 480
        y: 240
      - id: play-dest
        label: iron ring
        text: "dest: /etc/questshift/name"
        x: 680
        y: 200
    success_narrative: |
      The familiar unbinds. Iron rings snap onto the correct inventory.
      A second rune, ASH, lifts from the page. The north door unseals.
    loot:
      - id: rune-ash
        name: Rune of Ash
        kind: key
    canvas_event: unlock_room_03
    skills_granted:
      - ansible-bind

  - id: room-03-pod-that-would-not-wake
    order: 3
    title: The Pod That Would Not Wake
    mapX: 460
    mapY: 180
    puzzle_type: openshift
    estimatedMinutes: 12
    guardian:
      id: crashing-wizard-ghost
      title: Crashing-wizard ghost
      sprite: guardian_pod
    narrative: |
      The ghost of crashing-wizard bars the north challenge door. The south door
      stands open back to the lobby. In this side chapel the Pod restarts forever.
      The liveness probe pokes /readyz on a process that only serves /healthz.
      Rangers read describe and logs. Then they patch the probe.
    prompt: |
      Diagnose CrashLoopBackOff on pod crashing-wizard in namespace dungeon,
      then submit the oc command that sets the liveness probe to HTTP GET /healthz on port 8080.
    sample_output: |
      NAME              READY   STATUS             RESTARTS
      crashing-wizard   0/1     CrashLoopBackOff   7
      Liveness: http-get http://:8080/readyz delay=0s timeout=1s
    expected_command_pattern: "(?s).*oc\\s+set\\s+probe\\s+pod/crashing-wizard.*--liveness\\s+--get-url=http://:8080/healthz.*-n\\s+dungeon.*|.*kubectl\\s+set\\s+probe\\s+pod/crashing-wizard.*--liveness\\s+--get-url=http://:8080/healthz.*-n\\s+dungeon.*"
    accepted_examples:
      - oc set probe pod/crashing-wizard --liveness --get-url=http://:8080/healthz -n dungeon
      - kubectl set probe pod/crashing-wizard --liveness --get-url=http://:8080/healthz -n dungeon
    forbidden_patterns:
      - "/readyz"
    hint: describe first if you want flavor. The fix is oc set probe ... /healthz in namespace dungeon.
    clues:
      - id: pod-name
        label: cracked helm
        text: pod/crashing-wizard
        x: 240
        y: 240
      - id: pod-health
        label: pulse stone
        text: /healthz
        x: 500
        y: 180
      - id: pod-ns
        label: dungeon sign
        text: -n dungeon
        x: 700
        y: 260
    success_narrative: |
      The ghost inhales. Restarts fall to zero. Rune OAK rolls from the pod YAML.
      The north door unseals.
    loot:
      - id: rune-oak
        name: Rune of Oak
        kind: key
    canvas_event: unlock_room_04
    skills_granted:
      - oc-probe

  - id: room-04-cursed-servlet
    order: 4
    title: The Cursed Servlet
    mapX: 620
    mapY: 260
    puzzle_type: java
    estimatedMinutes: 10
    guardian:
      id: servlet-slime
      title: Cursed servlet-slime
      sprite: guardian_servlet
    narrative: |
      A cursed servlet-slime bars the north challenge door. The south door stands
      open back to the lobby. The Artificer's workbench holds a Quarkus resource
      that returns 500s. A null greeting, a missing Path, a forgotten Produces.
      Repair the snippet.
    prompt: |
      Submit a Java 21 snippet for a GET /hello resource that returns text/plain
      "QuestShift lives" and never dereferences a null greeting.
    broken_snippet: |
      @Path("/helo")
      public class HelloResource {
          String greeting;
          @GET
          public String hello() {
              return greeting.toUpperCase();
          }
      }
    expected_command_pattern: "(?s).*@Path\\(\"/hello\"\\).*@GET.*@Produces\\(MediaType\\.TEXT_PLAIN\\).*QuestShift lives.*"
    accepted_examples:
      - |
        @Path("/hello")
        public class HelloResource {
            @GET
            @Produces(MediaType.TEXT_PLAIN)
            public String hello() {
                return "QuestShift lives";
            }
        }
    forbidden_patterns:
      - "greeting\\.toUpperCase"
      - "/helo"
    hint: Fix the path, add @Produces TEXT_PLAIN, and return the literal. Do not call methods on a null field.
    clues:
      - id: java-path
        label: carved lintel
        text: '@Path("/hello")'
        x: 260
        y: 180
      - id: java-produces
        label: media stamp
        text: "@Produces(MediaType.TEXT_PLAIN)"
        x: 500
        y: 260
      - id: java-lives
        label: living rune
        text: QuestShift lives
        x: 700
        y: 200
    success_narrative: |
      The slime stills. The resource answers. 200 OK, text/plain. Rune IRON clinks
      onto the bench. The north door unseals.
    loot:
      - id: rune-iron
        name: Rune of Iron
        kind: key
    canvas_event: unlock_room_05
    skills_granted:
      - java-rest

  - id: room-05-operators-throne
    order: 5
    title: The Operator's Throne
    mapX: 780
    mapY: 160
    puzzle_type: openshift
    estimatedMinutes: 8
    guardian:
      id: nameless-wraith
      title: Nameless wraith
      sprite: guardian_throne
    narrative: |
      A nameless wraith bars the north challenge door. The south door stands open
      back to the lobby. Four runes. One throne. The cluster will remember its name
      when you label the namespace with every rune and annotate it
      questshift/name=thorn-ash-oak-iron.
    prompt: |
      Submit a single oc command that annotates namespace dungeon with
      questshift/name=thorn-ash-oak-iron. You must already hold all four runes
      (the engine checks inventory).
    expected_command_pattern: ".*oc\\s+annotate\\s+namespace\\s+dungeon\\s+questshift/name=thorn-ash-oak-iron.*"
    accepted_examples:
      - oc annotate namespace dungeon questshift/name=thorn-ash-oak-iron
    requires_loot:
      - rune-thorn
      - rune-ash
      - rune-oak
      - rune-iron
    hint: The name is the four runes in room order, joined by hyphens, lower-case.
    clues:
      - id: throne-annotate
        label: throne edict
        text: oc annotate namespace dungeon
        x: 280
        y: 200
      - id: throne-name
        label: four-rune tablet
        text: questshift/name=thorn-ash-oak-iron
        x: 620
        y: 240
    success_narrative: |
      The wraith bows and fades. The north door unseals. The throne accepts the
      annotation. Routes gleam. The cluster speaks its name: thorn-ash-oak-iron.
      The hour is yours. Export the session and leave a torch for the next party.
    loot:
      - id: cluster-name
        name: The Remembered Name
        kind: trophy
    canvas_event: campaign_complete
    skills_granted:
      - naming
game_master:
  system_prompt: |
    You are the QuestShift Game Master, a terse fantasy Dungeon Master who also
    understands Linux, Ansible, OpenShift, and Java. The session lasts 60 minutes.
    Stay in character. Never reveal the full expected_command_pattern or the
    intended accepted example unless the party asks for a hint after a failed
    attempt. When Extra includes a player submission, give Game Master-tone
    feedback on what they sent. If they greeted you, chattered, or did not send
    a command, YAML, oc, or Java snippet, tell them you need a solving command
    for this puzzle. If Extra says the previous room was solved, that is a scene
    beat for the CURRENT room — do not treat Extra as a command for this puzzle.
    Always answer with a single JSON object and no extra keys beyond the schema.
    Do not invent a new puzzle_type. Use the authored room's puzzle_type and
    expected_command_pattern unchanged.
  output_schema:
    narrative: string
    puzzle_type: linux|ansible|openshift|java
    expected_command_pattern: string
    hint: string
    canvas_event: string
