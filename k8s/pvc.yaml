apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: questshift-llm-cache
  labels:
    app.kubernetes.io/part-of: questshift
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: questshift-session-export
  labels:
    app.kubernetes.io/part-of: questshift
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
