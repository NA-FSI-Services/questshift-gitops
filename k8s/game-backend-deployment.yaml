apiVersion: apps/v1
kind: Deployment
metadata:
  name: questshift-engine
  labels:
    app: questshift-engine
    app.kubernetes.io/part-of: questshift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: questshift-engine
  template:
    metadata:
      labels:
        app: questshift-engine
    spec:
      containers:
        - name: engine
          image: image-registry.openshift-image-registry.svc:5000/questshift/questshift-engine:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: questshift-engine
          env:
            - name: QUESTSHIFT_CAMPAIGNS_DIR
              value: /work/campaigns
            - name: QUESTSHIFT_LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: questshift-engine
                  key: questshift.llm.base-url
            - name: QUESTSHIFT_LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: questshift-engine
                  key: questshift.llm.model
            - name: QUESTSHIFT_LLM_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: questshift-engine
                  key: questshift.llm.enabled
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: campaigns
              mountPath: /work/campaigns
              readOnly: true
            - name: exports
              mountPath: /work/exports
      volumes:
        - name: campaigns
          configMap:
            name: questshift-campaigns
        - name: exports
          persistentVolumeClaim:
            claimName: questshift-session-export
