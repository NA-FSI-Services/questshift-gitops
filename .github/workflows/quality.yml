name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Secret scan
        run: chmod +x .githooks/check-secrets && .githooks/check-secrets all
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - uses: azure/setup-kubectl@v5
        with:
          version: "v1.31.0"
      - run: chmod +x verify.sh && ./verify.sh
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14
