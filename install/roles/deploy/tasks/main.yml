---
- name: Ensure work directory exists
  file:
    path: "{{ playbook_dir }}/.work"
    state: directory
    mode: "0755"

- name: Wait for the Argo CD Application CRD
  command: oc wait --for=condition=Established crd/applications.argoproj.io --timeout=300s
  register: wait_crd
  changed_when: false

- name: Wait for the openshift-gitops server
  command: >-
    oc rollout status deploy/openshift-gitops-server
    -n {{ argocd_namespace }} --timeout=300s
  register: wait_argocd
  changed_when: false

- name: Apply QuestShift namespace
  shell: oc create namespace {{ questshift_namespace }} --dry-run=client -o yaml | oc apply -f -
  register: apply_ns
  changed_when: "'created' in apply_ns.stdout or 'configured' in apply_ns.stdout"

- name: Label namespace for OpenShift GitOps
  command: >-
    oc label namespace {{ questshift_namespace }}
    argocd.argoproj.io/managed-by={{ argocd_namespace }}
    --overwrite
  changed_when: true

- name: Remove unused Hugging Face secret if present
  command: >-
    oc delete secret questshift-hf
    --namespace {{ questshift_namespace }}
    --ignore-not-found
  changed_when: true

- name: Render Argo CD Application
  template:
    src: application.yaml.j2
    dest: "{{ playbook_dir }}/.work/application.yaml"
    mode: "0644"

- name: Apply Argo CD Application
  command: oc apply -f "{{ playbook_dir }}/.work/application.yaml"
  changed_when: true

- name: Wait for the Granite ModelCar PipelineRun
  command: python3 "{{ playbook_dir }}/scripts/wait_pipelinerun.py" "{{ questshift_namespace }}" questshift-install-granite
  register: wait_pipeline
  until: wait_pipeline.rc == 0
  retries: "{{ pipeline_wait_retries }}"
  delay: "{{ pipeline_wait_delay }}"
  changed_when: false

- name: Wait for QuestShift Application to become Healthy
  command: python3 "{{ playbook_dir }}/scripts/wait_application.py" "{{ argocd_namespace }}" "{{ argocd_application }}"
  register: wait_app
  until: wait_app.rc == 0
  retries: "{{ app_wait_retries }}"
  delay: "{{ app_wait_delay }}"
  changed_when: false

- name: Read the QuestShift route
  command: oc get route questshift -n {{ questshift_namespace }} -o jsonpath={.spec.host}
  register: qs_route
  changed_when: false
  failed_when: false

- name: Show the party URL
  debug:
    msg: >-
      {{ ('Open https://' + qs_route.stdout + ' to start a campaign.')
         if qs_route.stdout else
         'Route not ready yet; oc get route questshift -n questshift' }}
